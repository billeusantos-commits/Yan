name: Tailscale

on:
  workflow_dispatch:

jobs:
  tailscale:
    runs-on: windows-latest

    steps:
      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          if (!(Test-Path $installerPath)) {
              throw "Download do Tailscale falhou."
          }

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
              throw "Falha na instalação: código $($process.ExitCode)"
          }

          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tsExe)) {
              throw "Executável do Tailscale não encontrado."
          }

          if (!$env:TS_AUTHKEY) {
              throw "Configure o secret TAILSCALE_AUTH_KEY."
          }

          & $tsExe up --authkey="$env:TS_AUTHKEY" --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Falha ao conectar ao Tailscale."
          }

      - name: Verify Connection
        shell: pwsh
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $tsIP = & $tsExe ip -4

          if ($LASTEXITCODE -ne 0 -or !$tsIP) {
              throw "Não foi possível obter o IP do Tailscale."
          }

          Write-Host "Tailscale conectado!"
          Write-Host "IP: $tsIP"

      - name: Disconnect Tailscale
        if: always()
        shell: pwsh
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $tsExe) {
              & $tsExe down
          }
